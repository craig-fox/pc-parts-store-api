
name: Build

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Verify
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check JWT secrets
        run: |
          if [ -n "$JWT_SECRET" ]; then
            echo "JWT_SECRET is available"
          else
            echo "JWT_SECRET is NOT available"
            exit 1
          fi

          if [ -n "$JWT_EXPIRATION" ]; then
            echo "JWT_EXPIRATION is available"
          else
            echo "JWT_EXPIRATION is NOT available"
            exit 1
          fi

      - name: Build and verify
        run: mvn --batch-mode clean verify

  e2e:
    name: End-to-End Tests
    needs: build
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}

    steps:
      - name: Check out API
        uses: actions/checkout@v4
        with:
          path: pc-parts-store-api

      - name: Check out E2E tests
        uses: actions/checkout@v4
        with:
          repository: craig-fox/pc-parts-store-e2e
          ref: waiting-diagnosis
          path: pc-parts-store-e2e

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pc-parts-store-api/pom.xml
            pc-parts-store-e2e/pom.xml

      - name: Run E2E tests
        working-directory: pc-parts-store-e2e
        run: ./run-e2e.sh

  docker:
    name: Docker Build
    needs: build
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check Java version
        run: |
          java -version
          javac -version
          mvn -version

      - name: Build application
        run: mvn --batch-mode clean package -DskipTests

      - name: Build Docker images
        run: docker compose build