services:

  customer-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: customerdb
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: customer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer -d customerdb"]
      interval: 5s
      timeout: 5s
      retries: 10  
    ports:
      - "5432:5432"
    volumes:
      - customer-data:/var/lib/postgresql/data
    networks:
      - backend
  
  order-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 10    
    ports:
      - "5434:5432"
    volumes:
      - order-data:/var/lib/postgresql/data
    networks:
      - backend

  product-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: product
      POSTGRES_PASSWORD: product
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product -d productdb"]
      interval: 5s
      timeout: 5s
      retries: 10    
    ports:
      - "5433:5432"
    volumes:
      - product-data:/var/lib/postgresql/data
    networks:
      - backend


  inventory-postgres:
    image: postgres:17
    container_name: inventory-postgres
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventorydb"]
      interval: 5s
      timeout: 5s
      retries: 10    
    ports:
      - "5435:5432"
    volumes:
      - inventory-data:/var/lib/postgresql/data
    networks:
      - backend

  payment-postgres:
    image: postgres:17
    container_name: payment-postgres
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5436:5432"
    volumes:
      - payment-data:/var/lib/postgresql/data
    networks:
      - backend

  shipping-postgres:
    image: postgres:17
    container_name: shipping-postgres
    environment:
      POSTGRES_DB: shippingdb
      POSTGRES_USER: shipping
      POSTGRES_PASSWORD: shipping
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipping -d shippingdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5437:5432"
    volumes:
      - shipping-data:/var/lib/postgresql/data
    networks:
      - backend

  customer-service:
    build:
      context: ./customer-service
    depends_on:
      customer-postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://customer-postgres:5432/customerdb
      SPRING_DATASOURCE_USERNAME: customer
      SPRING_DATASOURCE_PASSWORD: customer
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8081:8080"
    networks:
      - backend    


  product-service:
    build:
      context: ./product-service
    container_name: product-service
    depends_on:
      product-postgres:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-postgres:5432/productdb
      SPRING_DATASOURCE_USERNAME: product
      SPRING_DATASOURCE_PASSWORD: product
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8083:8080"
    networks:
      - backend    


  order-service:
    build:
      context: ./order-service
    container_name: order-service
    depends_on:
      order-postgres:
        condition: service_healthy
      customer-service:
        condition: service_started
      product-service:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-postgres:5432/orderdb
      SPRING_DATASOURCE_USERNAME: order
      SPRING_DATASOURCE_PASSWORD: order
      CUSTOMER_SERVICE_URL: http://customer-service:8080
      PRODUCT_SERVICE_URL: http://product-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      SHIPPING_SERVICE_URL: http://shipping-service:8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SPRING_PROFILES_ACTIVE: dev

    ports:
      - "8082:8080"
    networks:
      - backend


  inventory-service:
    build:
      context: ./inventory-service
    container_name: inventory-service
    depends_on:
      inventory-postgres:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-postgres:5432/inventorydb
      SPRING_DATASOURCE_USERNAME: inventory
      SPRING_DATASOURCE_PASSWORD: inventory
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8084:8080"
    networks:
      - backend    

  authentication-service:
    build:
      context: ./authentication-service
    container_name: authentication-service
    environment:
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8085:8080"
    networks:
      - backend      

  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service
    depends_on:
      - payment-postgres
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-postgres:5432/paymentdb
      SPRING_DATASOURCE_USERNAME: payment
      SPRING_DATASOURCE_PASSWORD: payment
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
    ports:
      - "8086:8080"
    networks:
      - backend

  shipping-service:
    build:
      context: ./shipping-service
    container_name: shipping-service
    depends_on:
      shipping-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://shipping-postgres:5432/shippingdb
      SPRING_DATASOURCE_USERNAME: shipping
      SPRING_DATASOURCE_PASSWORD: shipping
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
    ports:
      - "8087:8080"
    networks:
      - backend

  sonarqube-postgres:
    image: postgres:17
    container_name: sonarqube-postgres
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sonarqube-data:/var/lib/postgresql/data
    networks:
      - backend

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      sonarqube-postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    networks:
      - backend

volumes:
  customer-data:
  order-data:
  product-data:
  inventory-data:
  sonarqube-data:
  payment-data:
  shipping-data:

networks:
  backend:  