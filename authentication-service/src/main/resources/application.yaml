spring:
  application:
    name: authentication-service

customer-service:
  base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}

server:
  port: ${SERVER_PORT:8085}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      probes:
        enabled: true


