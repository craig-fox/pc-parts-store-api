services:

  rabbitmq:
      image: rabbitmq:4-management
      container_name: rabbitmq
      environment:
        RABBITMQ_DEFAULT_USER: guest
        RABBITMQ_DEFAULT_PASS: guest
      healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 10s
      networks:
        - backend

  customer-postgres:
    volumes:
      - customer-e2e-data:/var/lib/postgresql/data

  order-postgres:
    volumes:
      - order-e2e-data:/var/lib/postgresql/data

  product-postgres:
    volumes:
      - product-e2e-data:/var/lib/postgresql/data

  inventory-postgres:
    volumes:
      - inventory-e2e-data:/var/lib/postgresql/data

  payment-postgres:
    volumes:
      - payment-e2e-data:/var/lib/postgresql/data

  shipping-postgres:
    volumes:
      - shipping-e2e-data:/var/lib/postgresql/data

  order-service:
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  customer-e2e-data:
  order-e2e-data:
  product-e2e-data:
  inventory-e2e-data:
  payment-e2e-data:
  shipping-e2e-data: