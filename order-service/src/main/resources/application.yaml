spring:
  application:
    name: order-service

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

resilience4j:
  retry:
    instances:

      downstreamRead:
        max-attempts: 3
        wait-duration: 10ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - nz.fox.craig.order.exception.DownstreamServiceUnavailableException

      payment:
        max-attempts: 3
        wait-duration: 10ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - nz.fox.craig.order.exception.DownstreamServiceUnavailableException

services:
  http-client:
    connect-timeout: 2s
    read-timeout: 5s

  customer:
    base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}

  product:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8083}

  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8084}

  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8086}

  shipping:
    base-url: ${SHIPPING_SERVICE_URL:http://localhost:8087}


