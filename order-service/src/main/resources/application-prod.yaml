spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

services:
  customer:
    base-url: ${CUSTOMER_SERVICE_URL}

  product:
    base-url: ${PRODUCT_SERVICE_URL}

  inventory:
    base-url: ${INVENTORY_SERVICE_URL}

resilience4j:
  retry:
    instances:
      downstreamRead:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - nz.fox.craig.order.exception.DownstreamServiceUnavailableException

      payment:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - nz.fox.craig.order.exception.DownstreamServiceUnavailableException