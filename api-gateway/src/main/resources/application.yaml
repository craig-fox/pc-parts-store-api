spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: authentication-service
              uri: ${AUTHENTICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/auth/**

            - id: customer-service
              uri: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/customers/**

            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/products/**

            - id: product-images
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/images/**

            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/orders/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
